# Build the first browser prototype on GitHub-hosted Linux runners.
#
# This workflow provides a repeatable compile check while local Windows
# development hardware is unavailable. It uploads the generated web files
# as an artifact; it does not publish a public website.

name: Browser Prototype Build

on:
  push:
    branches:
      - main
    paths:
      - "prototypes/browser/**"
      - ".github/workflows/browser-prototype.yml"
  pull_request:
    paths:
      - "prototypes/browser/**"
      - ".github/workflows/browser-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-browser:
    name: Compile WebAssembly prototype
    runs-on: ubuntu-latest

    steps:
      - name: Check out Veyra Engine
        uses: actions/checkout@v6

      - name: Install pinned Emscripten SDK
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 6.0.10
          actions-cache-folder: emsdk-cache

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build

      - name: Show toolchain versions
        run: |
          emcc --version
          cmake --version
          ninja --version

      - name: Configure browser build
        run: |
          emcmake cmake -S prototypes/browser -B build/browser -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Compile browser build
        run: |
          cmake --build build/browser --parallel 2

      - name: Upload browser output
        uses: actions/upload-artifact@v4
        with:
          name: veyra-browser-prototype
          path: build/browser/bin/
          if-no-files-found: error
          retention-days: 14
