name: Windows Installer Build
on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "installer/**"
      - "updater/**"
      - ".github/workflows/windows-installer-build.yml"
      - ".github/workflows/windows-updater-build.yml"
  pull_request:
    paths:
      - "engine/**"
      - "installer/**"
      - "updater/**"
      - ".github/workflows/windows-installer-build.yml"
      - ".github/workflows/windows-updater-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installer:
    name: Build and package Veyra Engine installer for Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out Veyra Engine
        uses: actions/checkout@v6

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Initialize MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure editor and runtime
        shell: pwsh
        run: |
          cmake -S engine -B build/engine -A x64 -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" -DBUILD_TESTING=ON -DVEYRA_BUILD_EDITOR=ON -DVEYRA_BUILD_RUNTIME=ON

      - name: Build editor, runtime, and tests
        shell: pwsh
        run: |
          cmake --build build/engine --config Release --parallel 2

      - name: Run all engine tests
        shell: pwsh
        run: |
          ctest --test-dir build/engine -C Release --output-on-failure --verbose

      - name: Configure, build, and test updater
        shell: pwsh
        run: |
          cmake -S updater -B build/updater -A x64 -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build/updater --config Release --parallel 2
          ctest --test-dir build/updater -C Release --output-on-failure --verbose

      - name: Stage editor and runtime
        shell: pwsh
        run: |
          $stage = "$env:GITHUB_WORKSPACE\build\installer-stage"
          $editor = Join-Path $stage "editor"
          $runtime = Join-Path $stage "runtime"
          $updater = Join-Path $stage "updater"
          New-Item -ItemType Directory -Force -Path $editor, $runtime, $updater | Out-Null

          $editorExe = "$env:GITHUB_WORKSPACE\build\engine\package\VeyraEditor.exe"
          if (-not (Test-Path $editorExe -PathType Leaf)) { throw "Editor executable missing: $editorExe" }
          Copy-Item "$env:GITHUB_WORKSPACE\build\engine\package\*" $editor -Recurse -Force
          windeployqt --release --compiler-runtime --dir $editor (Join-Path $editor "VeyraEditor.exe")
          if (-not (Test-Path (Join-Path $editor "platforms\qwindows.dll") -PathType Leaf)) {
            throw "Qt Windows platform plugin was not deployed."
          }

          cmake --install build/engine --config Release --prefix $runtime
          Copy-Item "engine/runtime/examples/first-scene.vscene" (Join-Path $runtime "first-scene.vscene")
          $updaterExe = "$env:GITHUB_WORKSPACE\build\updater\Release\VeyraUpdater.exe"
          if (-not (Test-Path $updaterExe -PathType Leaf)) { throw "Updater executable missing: $updaterExe" }
          Copy-Item $updaterExe $updater
          Copy-Item "updater/manifest.schema.json" $updater
          $licenses = Join-Path $updater "licenses"
          New-Item -ItemType Directory -Force -Path $licenses | Out-Null
          $monocypherLicense = "$env:GITHUB_WORKSPACE\build\updater\_deps\monocypher-src\LICENCE.md"
          $jsonLicense = "$env:GITHUB_WORKSPACE\build\updater\_deps\nlohmann_json-src\LICENSE.MIT"
          foreach ($license in @($monocypherLicense, $jsonLicense)) {
            if (-not (Test-Path $license -PathType Leaf)) { throw "Third-party license is missing: $license" }
          }
          Copy-Item $monocypherLicense (Join-Path $licenses "Monocypher-LICENCE.md")
          Copy-Item $jsonLicense (Join-Path $licenses "nlohmann-json-LICENSE.MIT")
          Copy-Item "updater/THIRD_PARTY_NOTICES.md" $updater
          $updaterHelp = & (Join-Path $updater "VeyraUpdater.exe") --help 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $updaterHelp -notmatch "verify-local") {
            throw "Updater CLI smoke test failed: $updaterHelp"
          }

          $vsWhere = Join-Path "${env:ProgramFiles(x86)}" "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vsWhere -PathType Leaf)) { throw "Could not locate vswhere.exe." }
          $vsInstall = & $vsWhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace(($vsInstall | Select-Object -First 1))) {
            throw "Could not locate a Visual Studio x64 C++ toolchain."
          }
          $vsInstall = ($vsInstall | Select-Object -First 1).Trim()
          $redistRoot = Join-Path $vsInstall "VC\Redist\MSVC"
          $crtDirectory = Get-ChildItem -Path $redistRoot -Directory | Sort-Object Name -Descending | ForEach-Object {
            $candidate = Join-Path $_.FullName "x64\Microsoft.VC143.CRT"
            if (Test-Path $candidate -PathType Container) { Get-Item $candidate }
          } | Select-Object -First 1
          if ($null -eq $crtDirectory) { throw "Could not find x64 Microsoft.VC143.CRT." }
          $crtDlls = @(Get-ChildItem -Path $crtDirectory.FullName -File -Filter "*.dll")
          if ($crtDlls.Count -eq 0) { throw "MSVC CRT folder contains no DLLs." }
          Copy-Item -Path (Join-Path $crtDirectory.FullName "*.dll") -Destination $editor -Force
          Copy-Item -Path (Join-Path $crtDirectory.FullName "*.dll") -Destination $runtime -Force

          foreach ($dll in @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll")) {
            foreach ($folder in @($editor, $runtime)) {
              if (-not (Test-Path (Join-Path $folder $dll) -PathType Leaf)) {
                throw "Missing MSVC runtime file $dll in $folder"
              }
            }
          }

          @'
          Veyra Engine 0.2.0 — Windows x64
          Install Veyra Engine using the setup executable.
          The editor and native runtime are installed as separate components.
          The runtime includes an initial bgfx Direct3D 11 renderer for 2D
          rectangle/circle/triangle primitives; packaged visual acceptance is pending.
          The editor includes Run Scene (F5) and Stop Runtime (Shift+F5).
          The updater is a local manifest/signature/package verifier and staging
          prototype; it does not yet download or apply remote updates.
          User projects and settings are stored outside the application install folder.
          '@ | Set-Content (Join-Path $stage "PACKAGE-README.txt") -Encoding utf8

      - name: Install Inno Setup 7.1.0
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup.7 --exact --version 7.1.0 --silent --accept-source-agreements --accept-package-agreements
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed." }

      - name: Compile Windows x64 installer
        shell: pwsh
        run: |
          $iscc = Get-Command "ISCC.exe" -ErrorAction SilentlyContinue
          if ($null -ne $iscc) {
            $isccPath = $iscc.Source
          } else {
            $candidates = @(
              "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
              "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe"
            )
            $isccPath = $candidates | Where-Object { Test-Path $_ -PathType Leaf } | Select-Object -First 1
          }
          if ([string]::IsNullOrWhiteSpace($isccPath)) { throw "ISCC.exe was not found after installing Inno Setup." }
          Push-Location "installer"
          try {
            & $isccPath "/DAppVersion=0.2.0" "veyra-engine.iss"
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
          } finally {
            Pop-Location
          }
          if (-not (Test-Path "build/installer/VeyraEngine-Setup-0.2.0-win64.exe" -PathType Leaf)) {
            throw "Expected installer output was not created."
          }

      - name: Install, smoke-test, and uninstall package
        shell: pwsh
        run: |
          $setup = "$env:GITHUB_WORKSPACE\build\installer\VeyraEngine-Setup-0.2.0-win64.exe"
          $installDir = "$env:RUNNER_TEMP\VeyraEngineSmokeTest"
          $projectDir = "$env:RUNNER_TEMP\VeyraProjects\KeepMe"
          New-Item -ItemType Directory -Force -Path $projectDir | Out-Null
          "User content must survive engine uninstall." | Set-Content (Join-Path $projectDir "KEEP.txt")

          $install = Start-Process -FilePath $setup -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent installation failed with exit code $($install.ExitCode)." }
          $editorExe = Join-Path $installDir "editor\VeyraEditor.exe"
          $runtimeExe = Join-Path $installDir "runtime\VeyraRuntime.exe"
          $sampleScene = Join-Path $installDir "runtime\first-scene.vscene"
          $updaterExe = Join-Path $installDir "updater\VeyraUpdater.exe"
          $updaterSchema = Join-Path $installDir "updater\manifest.schema.json"
          foreach ($required in @($editorExe, $runtimeExe, $sampleScene, $updaterExe, $updaterSchema)) {
            if (-not (Test-Path $required -PathType Leaf)) { throw "Installed file is missing: $required" }
          }
          $help = & $runtimeExe --help 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $help -notmatch "Usage:") { throw "Installed runtime command-line smoke test failed: $help" }
          $updaterHelp = & $updaterExe --help 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $updaterHelp -notmatch "verify-local") { throw "Installed updater command-line smoke test failed: $updaterHelp" }

          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $uninstaller -PathType Leaf)) { throw "Uninstaller was not created." }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Silent uninstall failed with exit code $($uninstall.ExitCode)." }
          if (Test-Path $editorExe -PathType Leaf) { throw "Editor executable remains after uninstall." }
          if (-not (Test-Path (Join-Path $projectDir "KEEP.txt") -PathType Leaf)) { throw "Uninstall removed user project data outside the install directory." }
          Write-Host "Install, runtime/updater CLI, uninstall, and external user-data preservation checks passed."
      - name: Upload Windows x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: veyra-engine-installer-windows-x64
          path: build/installer/VeyraEngine-Setup-0.2.0-win64.exe
          if-no-files-found: error
          retention-days: 14
