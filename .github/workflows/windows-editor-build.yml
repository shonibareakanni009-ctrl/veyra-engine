# Build and package the native Qt desktop scene editor on Windows.
name: Windows Editor Build
on:
  push:
    branches: [main]
    paths: ["engine/editor/**", "engine/CMakeLists.txt", ".github/workflows/windows-editor-build.yml"]
  pull_request:
    paths: ["engine/editor/**", "engine/CMakeLists.txt", ".github/workflows/windows-editor-build.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-editor:
    name: Build and test Veyra Editor for Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out Veyra Engine
        uses: actions/checkout@v6
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - name: Initialize MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Show tool versions
        shell: pwsh
        run: |
          cmake --version
          qmake --version
      - name: Configure editor and tests
        shell: pwsh
        run: |
          cmake -S engine -B build/editor -A x64 -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" -DBUILD_TESTING=ON -DVEYRA_BUILD_EDITOR=ON -DVEYRA_BUILD_RUNTIME=OFF
      - name: Compile editor and tests
        shell: pwsh
        run: |
          cmake --build build/editor --config Release --parallel 2
      - name: Run scene document tests
        shell: pwsh
        run: |
          ctest --test-dir build/editor -C Release --output-on-failure --verbose
      - name: Deploy Qt and MSVC runtime
        shell: pwsh
        run: |
          $package = "$env:GITHUB_WORKSPACE\build\editor\editor\package"
          $exe = "$package\VeyraEditor.exe"
          if (-not (Test-Path $exe -PathType Leaf)) { throw "Editor executable missing: $exe" }
          windeployqt --release --compiler-runtime --dir $package $exe
          if (-not (Test-Path "$package\platforms\qwindows.dll" -PathType Leaf)) {
            throw "Qt Windows platform plugin was not deployed."
          }
          $vsWhere = Join-Path "${env:ProgramFiles(x86)}" "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vsWhere -PathType Leaf)) { throw "Could not locate vswhere.exe." }
          $vsInstall = & $vsWhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace(($vsInstall | Select-Object -First 1))) { throw "Could not locate a Visual Studio x64 C++ toolchain." }
          $vsInstall = ($vsInstall | Select-Object -First 1).Trim()
          $redistRoot = Join-Path $vsInstall "VC\Redist\MSVC"
          if (-not (Test-Path $redistRoot -PathType Container)) { throw "MSVC redistributable directory not found: $redistRoot" }
          $crtDirectory = Get-ChildItem -Path $redistRoot -Directory | Sort-Object Name -Descending | ForEach-Object {
            $candidate = Join-Path $_.FullName "x64\Microsoft.VC143.CRT"
            if (Test-Path $candidate -PathType Container) { Get-Item $candidate }
          } | Select-Object -First 1
          if ($null -eq $crtDirectory) { throw "Could not find x64 Microsoft.VC143.CRT." }
          $runtimeDlls = @(Get-ChildItem -Path $crtDirectory.FullName -File -Filter "*.dll")
          if ($runtimeDlls.Count -eq 0) { throw "The MSVC CRT directory contains no DLLs." }
          Copy-Item -Path (Join-Path $crtDirectory.FullName "*.dll") -Destination $package -Force
          foreach ($dll in @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll")) {
            if (-not (Test-Path (Join-Path $package $dll) -PathType Leaf)) { throw "Missing MSVC runtime file: $dll" }
          }
          Write-Host "Packaged official MSVC runtime from $($crtDirectory.FullName)"
      - name: Write package instructions
        shell: pwsh
        run: |
          @'
          Veyra Engine Editor 0.1.0 — Windows x64
          Extract the entire folder and run VeyraEditor.exe.
          Keep all DLLs and the platforms folder beside the executable.
          Includes the early 2D scene editor, primitives, sprite import, hierarchy,
          transform inspector, and versioned .vscene save/load.
          This is an early development build; runtime integration and installer
          are not yet included in this editor-only CI artifact.
          '@ | Set-Content "$env:GITHUB_WORKSPACE\build\editor\editor\package\README.txt" -Encoding utf8
      - name: Upload complete editor application folder
        uses: actions/upload-artifact@v4
        with:
          name: veyra-editor-windows-x64-folder
          path: build/editor/package/
          if-no-files-found: error
          retention-days: 14
