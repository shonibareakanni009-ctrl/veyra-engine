# Build and package the first real Qt desktop editor on Windows.
# The artifact is a complete application folder, not a lone executable.
name: Windows Editor Build
on:
  push:
    branches: [main]
    paths: ["editor/**", ".github/workflows/windows-editor-build.yml"]
  pull_request:
    paths: ["editor/**", ".github/workflows/windows-editor-build.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-editor:
    name: Build Veyra Editor for Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out Veyra Engine
        uses: actions/checkout@v6

      # Install the pinned Qt 6 Widgets package matching the runner's MSVC.
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Show tool versions
        shell: pwsh
        run: |
          cmake --version
          qmake --version

      - name: Configure editor
        shell: pwsh
        run: |
          cmake -S editor -B build/editor -A x64 -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"

      - name: Compile editor
        shell: pwsh
        run: |
          cmake --build build/editor --config Release --parallel 2

      # windeployqt copies the Qt DLLs and platform plugins needed by this EXE.
      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          $package = "$env:GITHUB_WORKSPACE\build\editor\package"
          $exe = "$package\VeyraEditor.exe"
          if (-not (Test-Path $exe -PathType Leaf)) { throw "Editor executable missing: $exe" }
          windeployqt --release --compiler-runtime --dir $package $exe
          if (-not (Test-Path "$package\platforms\qwindows.dll" -PathType Leaf)) {
            throw "Qt Windows platform plugin was not deployed."
          }

          # Qt's deployment tool normally gathers the MSVC runtime, but we
          # explicitly stage the official x64 Visual C++ runtime DLLs beside
          # the application as an app-local deployment. This avoids requiring
          # the user to separately download/install the redistributable just
          # to test this portable development folder.
          $redistRoots = @(
            "$env:ProgramFiles\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC",
            "$env:ProgramFiles\Microsoft Visual Studio\2022\Professional\VC\Redist\MSVC",
            "$env:ProgramFiles\Microsoft Visual Studio\2022\Community\VC\Redist\MSVC",
            "$env:ProgramFiles\Microsoft Visual Studio\2022\BuildTools\VC\Redist\MSVC"
          )
          $runtimeFiles = @()
          foreach ($root in $redistRoots) {
            if (Test-Path $root) {
              $runtimeFiles = Get-ChildItem $root -Recurse -File -Filter "vcruntime140_1.dll" |
                Where-Object { $_.FullName -match "\\x64\\Microsoft\.VC143\.CRT\\" }
              if ($runtimeFiles.Count -gt 0) { break }
            }
          }
          if ($runtimeFiles.Count -eq 0) {
            throw "Could not locate the official x64 MSVC v143 runtime (vcruntime140_1.dll)."
          }

          $runtimeDirectory = $runtimeFiles[0].Directory.FullName
          Get-ChildItem $runtimeDirectory -File -Filter "*.dll" |
            Copy-Item -Destination $package -Force

          if (-not (Test-Path "$package\vcruntime140_1.dll" -PathType Leaf)) {
            throw "The required vcruntime140_1.dll was not staged in the application folder."
          }
          Write-Host "Staged app-local MSVC runtime from: $runtimeDirectory"
          Get-ChildItem $package -File -Filter "*140*.dll" | Select-Object Name, Length

      - name: Write package instructions
        shell: pwsh
        run: |
          @'
          Veyra Engine Editor 0.1.0 — Windows x64
          Extract the entire folder and run VeyraEditor.exe.
          Keep all DLLs and the platforms folder beside the executable.
          Included: Qt runtime, editable 2D scene viewport, object hierarchy,
          transform inspector, and versioned .vscene JSON save/load.
          Not implemented yet: project management, engine renderer integration,
          asset import, code editor, scripting, export, installer and uninstaller.
          This is an early development build; scene editing uses the editor 2D renderer.
          '@ | Set-Content "$env:GITHUB_WORKSPACE\build\editor\package\README.txt" -Encoding utf8

      - name: Upload complete editor application folder
        uses: actions/upload-artifact@v4
        with:
          name: veyra-editor-windows-x64-folder
          path: build/editor/package/
          if-no-files-found: error
          retention-days: 14
